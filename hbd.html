
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Noto+Sans+JP:wght@300;400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .scene {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 12px 8px 24px;
    min-height: 100vh;
    overflow: hidden;
  }

  .petals-container {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .falling-petal {
    position: absolute;
    top: -30px;
    opacity: 0;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    80%  { opacity: 0.6; }
    100% { transform: translateY(110vh) rotate(360deg) translateX(40px); opacity: 0; }
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 360px;
    background: #fffaf6;
    border-radius: 20px;
    border: 1px solid #e0b898;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 20px;
    z-index: 2;
  }

  .accent-bar {
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, #b55e48, #d98a60, #f0c07a, #d98a60, #b55e48);
  }

  .lantern-row {
    display: flex;
    gap: 20px;
    margin: 14px 0 8px;
  }

  .lantern {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.3s;
    -webkit-tap-highlight-color: transparent;
  }
  .lantern:active { transform: scale(1.2) rotate(-6deg); }

  .name-tag {
    background: #b55e48;
    border-radius: 30px;
    padding: 5px 20px;
    margin: 4px 0 2px;
  }
  .name-text {
    font-family: 'Noto Serif JP', serif;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    text-align: center;
  }

  .age-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin: 8px 0 2px;
  }
  .age-big {
    font-family: 'Noto Serif JP', serif;
    font-size: 56px;
    font-weight: 700;
    color: #b55e48;
    line-height: 1;
  }
  .age-kanji {
    font-family: 'Noto Serif JP', serif;
    font-size: 18px;
    color: #c87850;
    letter-spacing: 2px;
  }

  .main-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 22px;
    font-weight: 700;
    color: #7a2e1a;
    letter-spacing: 5px;
    text-align: center;
    margin: 2px 0;
    line-height: 1.4;
  }
  .subtitle {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    font-weight: 300;
    color: #b08060;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }

  .divider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 300px;
    margin-bottom: 10px;
  }
  .div-line { flex: 1; height: 0.5px; background: #d4a070; }
  .div-icon { font-family: 'Noto Serif JP', serif; font-size: 12px; color: #c08050; }

  .message-card {
    background: #fff4ee;
    border-radius: 12px;
    border: 0.5px solid #e8b898;
    padding: 12px 14px;
    width: 100%;
    margin-bottom: 10px;
  }
  .message-jp {
    font-family: 'Noto Serif JP', serif;
    font-size: 13px;
    font-weight: 300;
    color: #4a1e0e;
    line-height: 2.1;
    text-align: center;
    letter-spacing: 1px;
  }

  .wish-section {
    width: 100%;
    margin-bottom: 10px;
  }
  .wish-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 11px;
    color: #b07050;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 7px;
  }
  .wish-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
  }
  .wish-btn {
    background: #fff;
    border: 0.5px solid #d4a080;
    border-radius: 10px;
    padding: 8px 2px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: background 0.2s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .wish-btn:active { background: #fff0e8; }
  .wish-btn.active { background: #b55e48; border-color: #b55e48; }
  .wish-btn.active .wish-label { color: #fff; }
  .wish-icon { font-size: 18px; }
  .wish-label {
    font-family: 'Noto Serif JP', serif;
    font-size: 10px;
    color: #7a3a20;
    letter-spacing: 1px;
  }

  .wish-display {
    background: #fff4ee;
    border-radius: 10px;
    border: 0.5px solid #e8b898;
    padding: 9px 12px;
    margin-top: 6px;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wish-display-text {
    font-family: 'Noto Serif JP', serif;
    font-size: 12px;
    color: #5c2e1a;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.9;
    transition: opacity 0.3s;
  }

  .date-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 6px 0 10px;
  }
  .date-text {
    font-family: 'Noto Serif JP', serif;
    font-size: 12px;
    color: #9e5a3a;
    letter-spacing: 2px;
  }

  .confetti-btn {
    background: #b55e48;
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 11px 28px;
    font-family: 'Noto Serif JP', serif;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    width: 100%;
    max-width: 220px;
    margin-bottom: 6px;
    transition: background 0.2s;
  }
  .confetti-btn:active { background: #9a4a38; }

  .footer-note {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 10px;
    color: #b08060;
    letter-spacing: 3px;
    margin-top: 4px;
  }

  .accent-bar-bottom {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, #b55e48, #d98a60, #f0c07a, #d98a60, #b55e48);
  }

  .sparkle {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    animation: sparkle-pop 0.6s ease-out forwards;
    z-index: 10;
  }
  @keyframes sparkle-pop {
    0%   { transform: scale(0); opacity: 1; }
    70%  { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.5); opacity: 0; }
  }
</style>

<div class="scene" id="scene">
  <div class="petals-container" id="petals"></div>

  <div class="card">
    <div class="accent-bar"></div>

    <div class="lantern-row">
      <div class="lantern" onclick="bounceLantern(this)">
        <svg width="26" height="40" viewBox="0 0 28 44"><rect x="4" y="8" width="20" height="26" rx="10" fill="#e05030"/><rect x="10" y="2" width="8" height="7" rx="2" fill="#b84020"/><rect x="12" y="34" width="4" height="6" rx="1" fill="#b84020"/><text x="14" y="25" text-anchor="middle" font-family="Noto Serif JP,serif" font-size="11" fill="#ffe8a0" font-weight="700">寿</text></svg>
      </div>
      <div class="lantern" onclick="bounceLantern(this)">
        <svg width="26" height="40" viewBox="0 0 28 44"><rect x="4" y="8" width="20" height="26" rx="10" fill="#c04828"/><rect x="10" y="2" width="8" height="7" rx="2" fill="#903820"/><rect x="12" y="34" width="4" height="6" rx="1" fill="#903820"/><text x="14" y="25" text-anchor="middle" font-family="Noto Serif JP,serif" font-size="11" fill="#ffe8a0" font-weight="700">福</text></svg>
      </div>
      <div class="lantern" onclick="bounceLantern(this)">
        <svg width="26" height="40" viewBox="0 0 28 44"><rect x="4" y="8" width="20" height="26" rx="10" fill="#d85828"/><rect x="10" y="2" width="8" height="7" rx="2" fill="#a04018"/><rect x="12" y="34" width="4" height="6" rx="1" fill="#a04018"/><text x="14" y="25" text-anchor="middle" font-family="Noto Serif JP,serif" font-size="11" fill="#ffe8a0" font-weight="700">愛</text></svg>
      </div>
    </div>

    <div class="name-tag">
      <div class="name-text">Thaw Thaw Aung</div>
    </div>

    <div class="age-row">
      <span class="age-big">22</span>
      <span class="age-kanji">歳</span>
    </div>

    <div class="main-title">お誕生日<br>おめでとう</div>
    <div class="subtitle">Happy Birthday to You</div>

    <div class="divider-row">
      <div class="div-line"></div>
      <span class="div-icon">✿</span>
      <div class="div-line"></div>
    </div>

    <div class="message-card">
      <p class="message-jp">
        Thaw Thaw Aung さんへ、<br>
        二十二歳のお誕生日を<br>
        心よりお祝い申し上げます。<br><br>
        これからの日々が喜びと<br>
        希望に満ちあふれますように。
      </p>
    </div>

    <div class="wish-section">
      <div class="wish-title">— 願いを選んでください —</div>
      <div class="wish-grid">
        <button class="wish-btn" onclick="selectWish(this, '健康・長寿\nいつまでも元気で\n長生きしてください。')">
          <span class="wish-icon">🌿</span>
          <span class="wish-label">健康</span>
        </button>
        <button class="wish-btn" onclick="selectWish(this, '夢・成功\nあなたの夢が\n必ず叶いますように。')">
          <span class="wish-icon">⭐</span>
          <span class="wish-label">夢と成功</span>
        </button>
        <button class="wish-btn" onclick="selectWish(this, '幸福・愛\n愛と幸せが\nずっと続きますように。')">
          <span class="wish-icon">🌸</span>
          <span class="wish-label">幸福</span>
        </button>
        <button class="wish-btn" onclick="selectWish(this, '知恵・成長\n学び続け、\n輝き続けてください。')">
          <span class="wish-icon">📖</span>
          <span class="wish-label">知恵</span>
        </button>
        <button class="wish-btn" onclick="selectWish(this, '冒険・旅\n新しい世界へ\n旅立ってください。')">
          <span class="wish-icon">🗺️</span>
          <span class="wish-label">冒険</span>
        </button>
        <button class="wish-btn" onclick="selectWish(this, '友情・絆\n大切な人たちと\nずっと繋がれますように。')">
          <span class="wish-icon">🤝</span>
          <span class="wish-label">友情</span>
        </button>
      </div>
      <div class="wish-display">
        <span class="wish-display-text" id="wishText">タップして願いを選んでください ✨</span>
      </div>
    </div>

    <div class="date-row">
      <span style="color:#c96e5a;font-size:13px;">✦</span>
      <span class="date-text">二〇二五年　六月十日</span>
      <span style="color:#c96e5a;font-size:13px;">✦</span>
    </div>

    <button class="confetti-btn" id="celebBtn" onclick="celebrate()">
      🎊 祝福する 🎊
    </button>

    <div class="footer-note">祝福と愛をこめて</div>
    <div class="accent-bar-bottom"></div>
  </div>
</div>

<script>
  function createPetal(delay) {
    const c = document.getElementById('petals');
    const p = document.createElement('div');
    p.className = 'falling-petal';
    const colors = ['#f9c0cc','#f4a7b8','#fbd0db','#e88ea0','#fce4ec'];
    const size = 8 + Math.random() * 9;
    p.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size}px;animation-duration:${4+Math.random()*5}s;animation-delay:${delay}s;`;
    p.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 20 20"><ellipse cx="10" cy="6" rx="5" ry="8" fill="${colors[Math.floor(Math.random()*colors.length)]}" transform="rotate(${Math.random()*360} 10 10)" opacity="0.85"/></svg>`;
    c.appendChild(p);
    setTimeout(() => p.remove(), (9 + delay) * 1000);
  }

  for (let i = 0; i < 16; i++) createPetal(Math.random() * 6);
  setInterval(() => createPetal(0), 800);

  function bounceLantern(el) {
    el.style.transition = 'transform 0.15s';
    el.style.transform = 'scale(1.3) rotate(8deg)';
    setTimeout(() => { el.style.transform = 'scale(1) rotate(-4deg)'; }, 150);
    setTimeout(() => { el.style.transform = ''; }, 300);
    for (let i = 0; i < 5; i++) spawnSparkleAt(el, i * 60);
  }

  function spawnSparkleAt(el, delay) {
    setTimeout(() => {
      const rect = el.getBoundingClientRect();
      const s = document.createElement('div');
      s.className = 'sparkle';
      const sz = 5 + Math.random() * 8;
      const colors = ['#f0c07a','#e88ea0','#f9c0cc','#ffd060','#fff'];
      s.style.cssText = `width:${sz}px;height:${sz}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${rect.left + Math.random()*rect.width}px;top:${rect.top + window.scrollY + Math.random()*rect.height}px;`;
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 600);
    }, delay);
  }

  function selectWish(btn, text) {
    document.querySelectorAll('.wish-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const el = document.getElementById('wishText');
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = text; el.style.opacity = '1'; }, 200);
  }

  let celebrating = false;
  function celebrate() {
    if (celebrating) return;
    celebrating = true;
    const btn = document.getElementById('celebBtn');
    btn.textContent = '🎉 おめでとう！ 🎉';
    for (let i = 0; i < 24; i++) setTimeout(() => createPetal(0), i * 80);
    for (let i = 0; i < 18; i++) {
      setTimeout(() => {
        const s = document.createElement('div');
        s.className = 'sparkle';
        const sz = 6 + Math.random() * 10;
        const colors = ['#f0c07a','#e88ea0','#f9c0cc','#ffd060','#b55e48','#fff'];
        const vw = window.innerWidth, vh = window.innerHeight;
        s.style.cssText = `width:${sz}px;height:${sz}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${Math.random()*vw}px;top:${Math.random()*vh + window.scrollY}px;`;
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 600);
      }, i * 100);
    }
    setTimeout(() => { btn.textContent = '🎊 祝福する 🎊'; celebrating = false; }, 3000);
  }
</script>
